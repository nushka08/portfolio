<section class="contact-hero">
  <div class="contact-hero-grid">
    <div >
      <h1>contact.</h1>
      <p class="tagline">Get in touch with me via social media or send me an email.</p>
      <div class="social-grid">
        <a class="social-item" href="https://github.com/nushka08" target="_blank" rel="noopener">

<div class="sec2">
  <section class="contact-form-section">
    <h2>Send me an email</h2>
    <form id="contact-form" novalidate class="contact-form-grid">
      <div class="form-col">
        <div>
          <label for="name">Name</label>
          <input type="text" id="name" name="name">
          <p class="error-msg" id="name-error"></p>
        </div>
        <div>
          <label for="email">Email</label>
          <input type="text" id="email" name="email">
          <p class="error-msg" id="email-error"></p>
        </div>
      </div>
      <div class="form-col">
        <label for="message">Message</label>
        <textarea id="message" name="message"></textarea>
        <p class="error-msg" id="message-error"></p>
        <button type="submit" class="btn-dark">Send email</button>
      </div>
    </form>
    <p id="form-success"></p>
  </section>
</div>
